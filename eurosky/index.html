<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020817"><title>EuroSky Milano</title><link rel="stylesheet" href="/src/style.css"><style>html,body,#app{margin:0;width:100%;height:100%;background:#020817;color:#eaf6ff;font-family:system-ui,-apple-system,sans-serif}.fallback{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 30%,#123455,#020817 65%)}.fallback h1{font-size:clamp(38px,9vw,90px);margin:0;letter-spacing:.05em}.fallback p{opacity:.75}.loader{width:48px;height:48px;border:3px solid #ffffff22;border-top-color:#7dffdc;border-radius:50%;margin:24px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="app"><div class="fallback"><div><h1>EUROSKY<br>MILANO</h1><div class="loader"></div><p>Avvio simulatore di volo…</p></div></div></div><script type="module">import('/src/main.js').catch(e=>{console.error(e);document.querySelector('.fallback').innerHTML='<div><h1>EUROSKY MILANO</h1><p>Caricamento non riuscito. Aggiorna la pagina tra qualche secondo.</p></div>'})</script></body></html>
